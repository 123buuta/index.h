<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秘密のクイズ</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #fff5f8;
      padding: 40px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
    }

    input {
      width: 90%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 13px 30px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #ff8fab;
      color: white;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }

    #secretImage {
      display: none;
      max-width: 100%;
      margin-top: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>💌 秘密のクイズ</h1>

    <p>私たちの三原則は？</p>
    <p>（平仮名で入力してね）</p>

    <input
      type="text"
      id="answer"
      placeholder="答えを入力"
    >

    <br>

    <button onclick="checkAnswer()">答える</button>

    <div id="result"></div>

    <img id="secretImage" src="IMG_20261009_213619.jpg">

  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById("answer").value.trim();
      const result = document.getElementById("result");
      const image = document.getElementById("secretImage");

      if (answer === "たのしくげんきよくめりはり") {
        result.textContent = "🎉 正解！";
        result.style.color = "green";
        image.style.display = "block";
      } else {
        result.textContent = "😢 ちがうよ！もう一回考えてみて";
        result.style.color = "red";
        image.style.display = "none";
      }
    }
  </script>

</body>
                                         </html>
